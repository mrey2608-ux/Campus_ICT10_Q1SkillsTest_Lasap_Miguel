<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  </head>
  <body>
    <h1>My Receipt Generator</h1>

    <input type="checkbox" id="item1" value="180"> Burger and fries (₱180)<br>
    <input type="checkbox" id="item2" value="120"> Milk shake (₱120)<br>
    <input type="checkbox" id="item3" value="50"> Chocolate chip cookies (₱50)<br>
    <input type="checkbox" id="item4" value="150"> Chocolate Cake Slice (₱150)<br>
    <input type="checkbox" id="item5" value="130"> Ham Sandwich (₱130)<br>

    <br>
    <button id="order-btn" py-click="create_order">Place Order</button>

    <div id="show"></div>

    <script type="py">
from pyscript import document

def create_order(e):
    prod1 = document.getElementById("item1")
    prod2 = document.getElementById("item2")
    prod3 = document.getElementById("item3")
    prod4 = document.getElementById("item4")
    prod5 = document.getElementById("item5")

    subtotal = (float(prod1.value) * prod1.checked +
                float(prod2.value) * prod2.checked +
                float(prod3.value) * prod3.checked +
                float(prod4.value) * prod4.checked +
                float(prod5.value) * prod5.checked)

    tax_rate = 0.12
    tax = subtotal * tax_rate
    total = subtotal + tax

    receipt = f"""
==== Receipt ====
Subtotal: ₱{subtotal:.2f}
VAT: ₱{tax:.2f}
Total: ₱{total:.2f}
"""
    document.getElementById("show").innerText = receipt
    </script>
  </body>
</html>
